name: GHCR login test

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: login with GITHUB_TOKEN
        run: |
          echo "token length: ${#GHCR_TOKEN}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: [self-hosted, rcc-hiros]
    permissions:
      contents: read
      packages: read
    steps:
      - name: login with GITHUB_TOKEN
        shell: powershell
        run: |
          $t = "${{ secrets.GITHUB_TOKEN }}"
          "token length: $($t.Length)"
          "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          "exit code: $LASTEXITCODE"
