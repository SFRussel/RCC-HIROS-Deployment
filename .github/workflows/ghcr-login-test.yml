name: GHCR login test

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: [self-hosted, rcc-hiros]
    permissions:
      contents: read
      packages: read
    steps:
      - name: probe
        shell: powershell
        run: |
          $t = "${{ secrets.GITHUB_TOKEN }}"
          "token length: $($t.Length)"
          "--- docker version ---"
          docker version --format '{{.Client.Version}} / {{.Server.Version}}'
          "--- curl basic auth ---"
          curl.exe -s -u "SFRussel:$t" -o NUL -w "status: %{http_code}`n" https://ghcr.io/v2/
          "--- docker login -p ---"
          docker login ghcr.io -u "SFRussel" -p "$t"
          "exit: $LASTEXITCODE"
          "--- docker login stdin ---"
          $t | docker login ghcr.io -u "SFRussel" --password-stdin
          "exit: $LASTEXITCODE"
